name: Release

# 触发：仅符合语义化版本的 tag（v1.2.3，可带 -pre 后缀）；workflow_dispatch 输入同样校验
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v0.2.0，须符合语义化版本规范）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 阶段 1：版本号校验（不满足语义化版本即整体失败，不产生任何产物） ──
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 解析并校验版本号
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if ! [[ "$TAG" =~ $SEMVER_RE ]]; then
            echo "::error::版本号 '$TAG' 不符合语义化版本规范（示例：v1.2.3、v1.2.3-beta.1）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "版本号校验通过：$TAG"

  # ── 阶段 2：三平台并行构建打包 ──
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步版本号到工程文件（跨平台脚本，避免 sed/shell 方言差异）
        shell: bash
        run: |
          python3 .github/scripts/sync-version.py "${{ needs.validate.outputs.version }}" \
            || python .github/scripts/sync-version.py "${{ needs.validate.outputs.version }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Windows 固定 CMake 3.x（sherpa-onnx 1.12.x 的 show-info.cmake 与 CMake 4.x 不兼容）
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Windows 安装 Ninja（与下方 CMAKE_GENERATOR=Ninja 配套）
        if: runner.os == 'Windows'
        run: choco install -y ninja

      - name: Linux 系统依赖（GTK/WebKit/ALSA/libclang/cmake/AppIndicator——sherpa-onnx 静态编译与托盘打包所需）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libclang-dev cmake ninja-build pkg-config

      - name: 编译打包（Tauri bundle）
        # sherpa-rs 首次在 runner 上全量编译 onnxruntime/sherpa-onnx，单平台可能耗时 30~60 分钟
        # Windows 强制 Ninja 生成器：runner 镜像的 VS 2026 预览版生成器名与 CMake 3.31 不匹配
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || 'Unix Makefiles' }}
        run: pnpm tauri build

      - name: 收集产物并生成校验和
        # 注意：不能用 dist/ —— 那是 Vite 前端构建输出目录，会把 assets/ 混入产物
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/
          cd artifacts && sha256sum * > SHA256SUMS.txt && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  # ── 阶段 3：汇总三平台产物，生成版本变化说明并发布 Release ──
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: 生成版本变化说明
        id: notes
        run: bash .github/scripts/gen-release-notes.sh > release_notes.md
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}

      - name: 预览版本变化说明
        run: cat release_notes.md

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "VibeType ${{ needs.validate.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*
