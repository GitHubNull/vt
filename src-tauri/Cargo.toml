[package]
name = "vibetype"
version = "0.1.0"
description = "VibeType 码语 —— 隐私优先的 AI 语音输入法"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心（tech/02 2.3）
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 全局快捷键（tech/02 2.3 系统能力表；T-004 登记，三平台按住 / 切换双模式）
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按天滚动日志所需（tracing-subscriber 官方配套 crate；tech/02 未单列，T-001 登记补充）
tracing-appender = "0.2"
# 实时通信与设备连接（tech/02 2.3，T-001 预置登记，后续任务使用）
tokio-tungstenite = "0.24"
futures-util = "0.3"
qrcode = "0.14"
rand = "0.8"
mdns-sd = "0.11"
base64 = "0.22"
image = "0.25"
zip = "2"

[lints.clippy]
# tech/04 4.6：unwrap 警告级（CI 以 -D warnings 升格为错误）
unwrap_used = "warn"
