[package]
name = "vibetype"
version = "0.1.0"
description = "VibeType 码语 —— 隐私优先的 AI 语音输入法"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心（tech/02 2.3；tray-icon = T-015 托盘，image-png = 托盘图标解码）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 全局快捷键（tech/02 2.3 系统能力表；T-004 登记，三平台按住 / 切换双模式）
tauri-plugin-global-shortcut = "2"
# 音频采集（tech/02 2.3 系统能力表；T-005 登记，cpal 三平台统一抽象，Linux 需 ALSA）
cpal = "0.15"
# 文本注入（tech/02 2.3 系统能力表；T-007 登记，模拟键入 / 粘贴快捷键，三平台）
enigo = "0.6"
# 剪贴板读写（tech/02 2.3：剪贴板用 Tauri 内置 clipboard；T-007 登记）
tauri-plugin-clipboard-manager = "2"
# 系统通知（F-INPUT-09 无焦点兜底提示；T-007 登记）
tauri-plugin-notification = "2"
# HTTP 客户端（tech/02 2.3 权威清单：reqwest + rustls；T-016 更新检查、T-006 模型下载使用）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 本地离线 ASR（tech/02 2.3；T-006 登记：sherpa-rs 绑定 sherpa-onnx，静态编译 onnxruntime，
# 纯本地推理断网可用；首次编译联编 onnxruntime 约 15~30 分钟属正常）
sherpa-rs = { version = "0.6", default-features = false, features = ["static"] }
# 模型文件 SHA-256 校验（T-006；sherpa-rs-sys 构建期也用，应用侧独立登记）
sha2 = "0.10"
# 模型归档解包（T-006 下载后从 tar.bz2 提取模型文件）
tar = "0.4"
bzip2 = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按天滚动日志所需（tracing-subscriber 官方配套 crate；tech/02 未单列，T-001 登记补充）
tracing-appender = "0.2"
# 实时通信与设备连接（tech/02 2.3，T-001 预置登记，后续任务使用）
tokio-tungstenite = "0.24"
futures-util = "0.3"
qrcode = "0.14"
rand = "0.8"
mdns-sd = "0.11"
base64 = "0.22"
image = "0.25"
zip = "2"

# 平台焦点检测（T-007；仅对应平台编译）
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.9"
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[features]
# T-012：向集成测试（tests/）与基准（benches/）开放平台层 mock
# （MockAudioBackend / MockTextInjector）。生产构建不带此 feature。
test-utils = []

[[bench]]
# T-012 核心链路基准：固定音频样本驱动全链路，输出 P50 / P95（harness = false，
# 自带 main 与报告输出）。
name = "pipeline_bench"
harness = false
required-features = ["test-utils"]

[lints.clippy]
# tech/04 4.6：unwrap 警告级（CI 以 -D warnings 升格为错误）
unwrap_used = "warn"
